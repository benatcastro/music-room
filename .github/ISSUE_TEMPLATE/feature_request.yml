name: "Feature Request"
description: "Suggest a new feature or enhancement for this project."
title: "[FEATURE] <Brief Description>"
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: "## 🚀 Feature Request\nPlease fill out the sections below to describe your feature request."

  - type: textarea
    id: description
    attributes:
      label: "Describe the Feature"
      description: "A clear and concise description of what the feature should do."
      placeholder: "Explain the feature you want to add..."
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: "Additional Context (optional)"
      description: "Add any relevant links, screenshots, or other context."
      placeholder: "Provide references, design mocks, or related discussions..."
    validations:
      required: false
